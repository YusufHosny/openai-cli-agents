[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-cli-agents"
version = "0.1.0"
description = "Drive claude -p and opencode as stateless completions, and serve them behind an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "typer>=0.12", "pydantic>=2"]

[project.scripts]
openai-cli-agents = "openai_cli_agents.api.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.40", "openai-cli-agents[server]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
